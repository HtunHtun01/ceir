name: Build CEIR Checker APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Project and Build
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -name "settings.gradle" -o -name "build.gradle" | head -n 1 | xargs dirname)
          if [ -n "$TARGET_DIR" ] && [ "$TARGET_DIR" != "." ]; then
            echo "Entering project directory: $TARGET_DIR"
            cd "$TARGET_DIR"
          fi
          gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ceir-checker-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
